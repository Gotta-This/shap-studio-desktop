name: Hold v1.1.2 pending native UI review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release-v1.1.2.yml]
permissions:
  contents: read
concurrency:
  group: release-v1.1.2
  cancel-in-progress: true
jobs:
  hold:
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Release paused pending packaged native date-column verification.'
