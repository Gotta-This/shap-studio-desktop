# Superseded by v1.1.2 after the native macOS modal-popup click review.
name: Hold superseded v1.1.1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release-v1.1.1.yml]
permissions:
  contents: write
concurrency:
  group: release-v1.1.1
  cancel-in-progress: true
jobs:
  mark-prerelease:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Exclude the superseded build from stable automatic updates
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.1" --jq .id)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F prerelease=true -f make_latest=false
